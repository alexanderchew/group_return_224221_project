[project]
name = "lecture-companion-backend"
version = "0.1.0"
description = "Alex's local lecture processing API and persistent worker"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.162.0",
    "httpx==0.28.1",
    "openai==3.45.0",
    "pydantic-settings==2.16.2",
    "python-multipart==0.0.33",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "ruff==0.17.3",
]

[tool.pytest.ini_options]
pythonpath = ["services/api"]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
